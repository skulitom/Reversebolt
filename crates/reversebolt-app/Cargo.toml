[package]
name = "reversebolt-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "Reversebolt"
path = "src/main.rs"

[dependencies]
reversebolt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = ["Foundation", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
