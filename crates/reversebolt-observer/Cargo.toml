[package]
name = "reversebolt-observer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
comparison-priority-research = ["reversebolt-core/comparison-priority-research"]

[[example]]
name = "comparison-priority-replay"
required-features = ["comparison-priority-research"]

[dependencies]
reversebolt-core.workspace = true
reversebolt-vision = { path = "../reversebolt-vision" }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
