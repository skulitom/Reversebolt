[workspace]
members = ["crates/reversebolt-core", "crates/reversebolt-app", "crates/reversebolt-mcp", "crates/reversebolt-jobs", "crates/reversebolt-vision", "crates/reversebolt-observer", "crates/reversebolt-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reversebolt-core = { path = "crates/reversebolt-core" }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
strip = true
